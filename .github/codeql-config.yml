name: trading-agents CodeQL config

# Custom project queries. Without this the pack in `codeql/python-security/` is
# never run — it sat unreferenced from 2026-06-23 until 2026-07-27, looking like
# coverage while examining nothing. `TaintTracking.ql` is project-specific and
# not covered by the standard suite: it tracks MCP tool args, os.environ, argv
# and argparse namespaces into `urllib.request.urlopen`, which this codebase
# calls with env-derived URLs in the provider, execution and probe paths.
queries:
  - uses: ./codeql/python-security/TaintTracking.ql

# Paths that CodeQL should never analyse — its own database artifacts,
# CLI binaries/extractor scripts, and non-project directories.
paths-ignore:
  - ".codeql-db/**"   # local CodeQL database
  - ".tools/**"       # CodeQL CLI + language packs (contains index.py, python_tracer.py, etc.)
  - ".venv/**"        # Python virtual environment (uv-managed)
  - "codeql/**"       # YAML diagnostic configs, not Python source

# Suppress known false-positive rules that fire on intentional codebase patterns.
#
# py/ineffectual-statement: Protocol method bodies use `...` (Ellipsis) as the
#   standard Python idiom for abstract/interface declarations.  CodeQL treats any
#   expression-statement with no side-effect as suspicious, but `...` in a Protocol
#   is semantically required and correct.
#
# py/multiple-definition: The fault-boundary pattern initialises a variable to a
#   safe fallback value, then overwrites it inside `with fault_boundary(...) as cap:`
#   This double-assignment is intentional and guards against propagating exceptions.
query-filters:
  - exclude:
      id: py/ineffectual-statement
  - exclude:
      id: py/multiple-definition
