# Dependabot — monthly, batched dependency surveillance.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Three ecosystems are watched:
#   - uv             → Python deps in pyproject.toml + uv.lock
#   - github-actions → action versions pinned in .github/workflows
#   - docker         → the base image in the Dockerfile
#
# BATCHING POLICY (chore-dependabot-monthly-batch, 2026-07-27 — reverses the
# earlier "every major gets its own PR" rule; see docs/design-log.md DL-64).
# Routine surveillance is noise, and a weekly trickle of solo major bumps got
# closed unread rather than reviewed — which is worse than batching. So:
#   - monthly, not weekly;
#   - majors are folded INTO the group for CI tooling and dev dependencies,
#     where a break costs a red build and nothing else;
#   - a MAJOR bump to a Python *production* dependency still opens its own PR,
#     because that is the one class that reaches the running fleet.
# Expect ≤3 PRs in a typical month.
#
# This is not the CVE net and was never load-bearing for one: `pip-audit` runs
# in `make ci` and fails the build on a known Python vulnerability, and the
# agent images are Trivy-scanned for HIGH/CRITICAL at build time. Every PR here
# still runs the full CI lane (lint, types, import boundaries, 100% coverage
# ratchet, pip-audit, detect-secrets) before it can merge.
version: 2
updates:
  # ── Python (uv: pyproject.toml + uv.lock) ───────────────────────────────────
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Australia/Melbourne"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Production majors are deliberately absent here: they fall out of the
      # group and open a solo PR, so a runtime-breaking bump is reviewed alone.
      python-production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      python-development:
        dependency-type: "development"
        update-types: ["major", "minor", "patch"]

  # ── GitHub Actions (workflow action versions) ───────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Australia/Melbourne"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  # ── Docker base images (the 14 images actually built) ───────────────────────
  # Was `directory: "/"`, which watched only the root Dockerfile — the pre-P15
  # monolith that no build referenced. It was deleted 2026-07-27 (DL-65), so this
  # now points at the images `build-images.yml` and `docker-compose.yml` really
  # build. CAVEAT: those use `dhi.io/python` (Docker Hardened Images); whether
  # Dependabot can resolve that registry is UNVERIFIED — if it cannot, this
  # produces nothing. Trivy HIGH/CRITICAL at image build remains the actual CVE
  # net (hardening backlog E/H); treat this as freshness signal, not a gate.
  - package-ecosystem: "docker"
    directories:
      - "/agents/*"
      - "/orchestration"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Australia/Melbourne"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # The codebase targets Python 3.13 (requires-python, ruff/mypy py313), so a
      # 3.13 → 3.14 move is a deliberate runtime migration, not an auto-merge.
      #
      # This rule used to block ONLY semver-major, while its comment claimed to
      # "pin to 3.13.x". 3.13 → 3.14 is semver-MINOR, so on 2026-07-27 exactly that
      # bump sailed through the guard and auto-merged (#73). It landed in the dead
      # root Dockerfile so nothing broke — but the guard was wrong, not lucky.
      # Blocking minor as well as major is what "pin to 3.13.x" actually requires.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
