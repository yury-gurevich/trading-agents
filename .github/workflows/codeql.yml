name: CodeQL

# Code-level static analysis (SAST) — complements pip-audit, which only covers
# dependency CVEs. Runs on pushes/PRs to main and a weekly scheduled deep scan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:30 UTC (~weekly), offset from the Dependabot run.
    - cron: "30 5 * * 1"
  workflow_dispatch:

# One group per commit, not per ref (work-queue item 31). A per-ref group with
# cancel-in-progress let the next push on main cancel a merge's scan, so a code
# merge followed by a docs commit was never analysed at its own SHA (15 of the
# last 200 main runs were cancelled). cancel-in-progress: false alone is not
# enough: GitHub keeps one *pending* run per group, so the middle push of a
# burst would still be dropped. Keying on the SHA gives every commit its own
# scan (median 153 s) and only collapses re-runs of the same commit.
concurrency:
  group: codeql-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL to upload findings to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
          build-mode: none
          # The leading '+' APPENDS to the queries declared in config-file.
          # Without it this value REPLACES them, and the custom pack in
          # codeql/python-security/ silently does not run - verified on
          # 2026-07-27: a green run evaluated 172 queries, none of them ours.
          queries: +security-and-quality
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:python"
