name: CodeQL

# Code-level static analysis (SAST) — complements pip-audit, which only covers
# dependency CVEs. Runs on pushes/PRs to main and a weekly scheduled deep scan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 05:30 UTC (~weekly), offset from the Dependabot run.
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      # Required for CodeQL to upload findings to the Security tab.
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          build-mode: none
          # The leading '+' APPENDS to the queries declared in config-file.
          # Without it this value REPLACES them, and the custom pack in
          # codeql/python-security/ silently does not run - verified on
          # 2026-07-27: a green run evaluated 172 queries, none of them ours.
          queries: +security-and-quality
          config-file: .github/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:python"
