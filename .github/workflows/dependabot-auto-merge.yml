name: Dependabot auto-merge

# Keeps routine dependency PRs out of the human loop. For non-major Dependabot
# updates, this enables GitHub auto-merge, so the PR merges itself once the
# required CI checks (quality, test, security) pass. MAJOR updates are
# deliberately left open for a human to look at — they can change behaviour.
#
# Interaction with grouped updates (DL-64): `fetch-metadata` reports a GROUP's
# `update-type` as the HIGHEST semver change across its members. Since 2026-07-27
# the dev / github-actions / docker groups fold majors in, so one major makes the
# whole monthly batch wait for a human — routine members included. That is the
# intended trade (one thing to look at, occasionally), and it is why Python
# *production* majors were deliberately left OUT of their group: that group stays
# minor/patch-only, so production dependency updates keep auto-merging.
#
# No approval step: `main` requires status checks but NOT a review, and the
# Actions GITHUB_TOKEN is hard-blocked from approving PRs by GitHub, so
# `gh pr review --approve` always fails. Auto-merge alone is sufficient here.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for non-major updates
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
